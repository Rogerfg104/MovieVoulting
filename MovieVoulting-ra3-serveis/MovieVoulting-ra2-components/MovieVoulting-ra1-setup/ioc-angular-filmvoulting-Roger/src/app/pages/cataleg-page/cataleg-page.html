<!-- LOADING -->
<div *ngIf="elementService.carregant()">
  <p>Carregant...</p>
</div>

<!-- ERROR -->
<div *ngIf="elementService.error()">
  <p>{{ elementService.error() }}</p>
  <button (click)="reintentar()">Reintentar</button>
</div>

<!-- ÉXITO -->
<div *ngIf="!elementService.carregant() && !elementService.error()">
  <div *ngFor="let el of elementService.elements()">
    {{ el.titol }}
  </div>
</div>
